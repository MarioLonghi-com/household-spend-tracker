name: Feature request
description: Something the tracker should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What you would like to happen. If it involves a bank's file format, describe its shape; do not attach a real statement.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
