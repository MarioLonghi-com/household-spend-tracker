name: scorecard

# OpenSSF Scorecard: an automated read of the repository's own hygiene --
# pinned dependencies, token permissions, branch protection, dangerous
# workflow patterns, whether releases are signed. Weekly, about a minute,
# free on a public repository. `publish_results: true` puts the score on
# securityscorecards.dev and enables the README badge.
#
# Two of its checks will always score low here and can be ignored: Fuzzing
# (no fuzz target, none warranted) and CII-Best-Practices (a self-assessment
# badge). The Python dependencies are locked with hashes in requirements*.txt
# since #46, so Pinned-Dependencies reads those rather than floors.

on:
  branch_protection_rule:
  schedule:
    - cron: "23 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write  # the SARIF upload to the Security tab
      id-token: write         # to publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
