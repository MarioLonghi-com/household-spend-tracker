name: release

# A tag is the only thing that publishes anything from this repository.
#
# The point of Route B in the production plan: **a user should need Python and
# nothing else.** `app/static/dist` is gitignored, so a fresh clone has no UI
# at all until somebody runs `npm ci && npm run build` -- which is a second
# toolchain to install to run an app whose server does not need it, and the
# single biggest piece of friction for a stranger. This job runs that build
# once, here, and ships the result inside the tarball.
#
#     curl -L .../releases/latest/download/household-spend-tracker.tar.gz | tar xz
#     cd household-spend-tracker-*
#     make install-prod && make migrate && make serve
#
# Each release carries the tarball twice, byte for byte the same:
# `household-spend-tracker-<version>.tar.gz`, and the unversioned
# `household-spend-tracker.tar.gz`, which is what the README's
# `releases/latest/download/` link names -- a link that has to work for every
# future release cannot carry a version. Both unpack to
# `household-spend-tracker-<version>/`.
#
# `make install-prod` installs the runtime requirements and nothing else; the
# Python half standing alone is what makes that possible.
#
# **The jobs that write are separate from the jobs that build, and the split
# is the point.** `build` and `image` run `npm ci` -- every install script of
# every package in the client's tree -- and hold a read-only token. `publish`
# holds `contents: write`, `publish-image` holds `packages: write`,
# `publish-release` both, and none of them runs anything but a download, a
# check and GitHub's or Docker's own tools. When building and publishing were
# one job, anything a compromised
# dependency ran during `npm ci` ran next to a token that can rewrite this
# repository's releases.
#
# Added for the public repository (#242):
#
#   - `verify`: the tagged tree must be one tests.yml already passed (the
#     `green-<tree>` artifact its `ci-ok` job records). A tag on a tree CI never
#     saw is refused rather than shipped.
#   - Provenance attestations for the tarball and the image, so
#     `gh attestation verify <file> --repo MarioLonghi-com/household-spend-tracker`
#     proves what was built, from which commit, by which workflow.
#   - The container, published to ghcr.io. It was built and started in CI but
#     never shipped.
#
# Reshaped for the updater (#181), which has to be able to trust a release the
# moment it sees one:
#
#   - **The image is an index of two platforms**, linux/amd64 and linux/arm64,
#     each built and smoke-tested natively on its own runner. Docker Desktop on
#     an Apple-silicon Mac ran the amd64-only image emulated.
#   - **The release goes public last.** `publish` creates it as a draft;
#     `publish-image` pushes and attests the index and proves the package can
#     be pulled with no credentials; `publish-release` then flips the draft
#     and, only after that, moves the floating `X.Y` and `latest` tags. A run
#     that fails halfway leaves a draft nobody is offered, not a public
#     release with no image behind it -- which is what the Actions-billing
#     block on 0.3.1 left.
#   - **`org.opencontainers.image.version` is the bare `X.Y.Z`**, the number
#     `/api/health` reports and the updater compares, not the tag.
#   - **The release body leads with the CHANGELOG section** the tag is checked
#     against; GitHub's generated pull-request list follows it.
#
# And the self-updater's image beside the app's (#164), through exactly the
# same steps: the `updater` target of the same Dockerfile, built and
# smoke-tested natively per platform in `image`, labels compared in `labels`,
# pushed by digest, indexed, attested and pulled anonymously in
# `publish-image`, floating tags moved in `publish-release`. Every release
# ships one (design notes A10), and the updater verifies each against its own
# attestation subject, so an app attestation never passes for it (R19).
#
# **Its package is new, and ghcr.io may create it private** on the first
# push. The anonymous pull in `publish-image` then fails, while the release is
# still a draft, with the sentence that says where to make it public; after
# that, re-running the failed jobs finishes the release.
#
# Started by hand (`workflow_dispatch`) from a branch it is a dry run: it
# builds and smoke-tests both artefacts on both platforms, checks the two
# platform images carry the same labels, and publishes nothing.
#
# The Python dependencies are locked with hashes (#46): `make install-prod`
# installs requirements.txt with `--require-hashes`, so a tarball installs
# exactly the set it was tested with. Each release also carries an SBOM of that
# set, in CycloneDX.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every job says what it needs; the default is read-only.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Lower case: ghcr.io refuses an upper-case repository name, and the
  # organisation's is not.
  IMAGE: ghcr.io/mariolonghi-com/household-spend-tracker
  # The self-updater's package: the app's name and `-updater`, the second of
  # the two repositories updater/engine.py will pull from.
  UPDATER_IMAGE: ghcr.io/mariolonghi-com/household-spend-tracker-updater

jobs:
  # Did CI pass on exactly this tree? Looked up the same way tests.yml's
  # `changes` job looks it up: an unexpired `green-<tree>` artifact, from a run
  # of tests.yml on this repository's own branches, that concluded `success`.
  # The release pull request records it, or the pull request into `dev` whose
  # tree the release carries unchanged.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: this tree passed CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          ok=""
          for run_id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=green-${tree}&per_page=20" \
              --jq '.artifacts[] | select(.expired == false)
                    | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                    | .workflow_run.id'); do
            said="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.conclusion, .path] | join(" ")')"
            if [ "$said" = "success .github/workflows/tests.yml" ]; then
              ok="$run_id"; break
            fi
          done
          if [ -z "$ok" ]; then
            echo "tree $tree has no green record from tests.yml."
            echo "Run it on this tree -- the release pull request does -- and re-tag."
            exit 1
          fi
          echo "tree $tree passed in run $ok"

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The PR into main ran the full release check; this is the last word on
      # the tag itself -- that it matches, and the CHANGELOG has its section.
      # Skipped when started by hand from a branch, which has no tag to check.
      - name: the CHANGELOG has a dated section for this tag
        if: github.ref_type == 'tag'
        run: python -m scripts.release_check --tagged "${GITHUB_REF_NAME}"

      # The tag and the three version files have to agree, or `/api/health`
      # reports one number while the release is named another -- and
      # `/api/health` is what an operator curls to confirm what is running.
      - name: the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          python - "$tagged" <<'PY'
          import sys
          from scripts.version import declared
          tagged = sys.argv[1]
          wrong = {where: v for where, v in declared().items() if v != tagged}
          if wrong:
              print(f"the tag says {tagged}, but:")
              for where, version in wrong.items():
                  print(f"  {where} says {version}")
              print("Run `make version BUMP=...` and re-tag.")
              raise SystemExit(1)
          print(f"tag and all three files agree at {tagged}")
          PY

      # The tag's version, or on a dry run from a branch the commit -- a branch
      # name can hold a `/`, which a file name cannot. `image` names its
      # version label from this too, so the label is `0.7.1`, never `v0.7.1`.
      - name: the version this build is named for
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="snapshot-${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      # The section the check above just required, lifted out for the release
      # body: what changed, in the words the CHANGELOG uses, before GitHub's
      # list of pull requests. Read through the same parser the check uses, so
      # the two cannot disagree about where a section ends.
      - name: the CHANGELOG section for the release body
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          python - "$VERSION" <<'PY'
          import pathlib
          import sys
          from scripts.release_check import _VERSIONED, sections
          version = sys.argv[1]
          for section in sections(pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")):
              named = _VERSIONED.match(section.title)
              if named and named["version"] == version:
                  break
          else:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          lines = section.body.strip().splitlines()
          while lines and lines[-1].strip() in ("", "---"):
              lines.pop()
          body = "\n".join(lines).strip() + "\n"
          pathlib.Path("dist/release-notes.md").write_text(body, encoding="utf-8")
          print(body)
          PY

      # The tarball ships without .git, so the app would have nobody to ask
      # which commit it is. Stamped here, while there is one; see app/build.py.
      - name: stamp the commit
        run: python -m scripts.build_stamp

      # `git archive` would leave the built client out -- it is gitignored, and
      # shipping it is the entire point of this job. So the tree is assembled
      # by hand, and what is excluded is listed rather than implied.
      - name: build the tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          staging="household-spend-tracker-${VERSION}"
          mkdir -p "dist/${staging}"
          cp -R app statements scripts migrations \
                Makefile alembic.ini pyproject.toml requirements.in requirements.txt \
                requirements-dev.in requirements-dev.txt README.md LICENSE SECURITY.md \
                CHANGELOG.md CONTRIBUTING.md deploy Dockerfile compose.yaml \
                "dist/${staging}/"
          # No tests, no client sources, no node_modules, no .git. Somebody who
          # wants those clones the repository; this is the run-it path.
          find "dist/${staging}" -name '__pycache__' -type d -prune -exec rm -rf {} +
          test -f "dist/${staging}/app/static/dist/index.html" \
            || { echo "the client is not in the tarball, which is the one thing it is for"; exit 1; }
          test -f "dist/${staging}/app/build.json" \
            || { echo "the commit stamp is not in the tarball"; exit 1; }
          tar -C dist -czf "dist/${staging}.tar.gz" "${staging}"
          # The unversioned alias the README links to: the same bytes.
          cp "dist/${staging}.tar.gz" "dist/household-spend-tracker.tar.gz"
          # From inside dist/, so each file names its tarball as a user who
          # downloaded both beside each other will have it: `sha256sum -c`.
          for tarball in "${staging}.tar.gz" "household-spend-tracker.tar.gz"; do
            (cd dist && sha256sum "$tarball") | tee "dist/${tarball}.sha256"
          done

      # What `make install-prod` installs from this tarball, as CycloneDX: the
      # runtime lock, read as written (`--disable-pip`), nothing resolved. The
      # auditor is the version the dev lock pins. pip-audit exits non-zero when
      # it also finds an advisory; that is the audit job's to report, so the
      # check here is only that the SBOM was written.
      - name: the SBOM of the runtime dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install "$(grep -oE '^pip-audit==[^ ]+' requirements-dev.txt)"
          sbom="dist/household-spend-tracker-${VERSION}.cdx.json"
          pip-audit --require-hashes --disable-pip -r requirements.txt \
            --format cyclonedx-json --output "$sbom" || true
          test -s "$sbom" || { echo "no SBOM was written"; exit 1; }

      # release-notes.md rides along; on a dry run there is none, and the
      # tarballs are enough for the upload to succeed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tarball
          path: |
            dist/*.tar.gz*
            dist/*.cdx.json
            dist/release-notes.md
          if-no-files-found: error

  # The default (Chainguard) image, built from nothing -- no layer cache, so a
  # release carries no layer an earlier build on another ref put there --
  # once per platform, each on a runner of that architecture: no emulation,
  # and the smoke test runs the binary a user on that architecture will run.
  # Started the way tests.yml's `image` job starts it, then written out as an
  # OCI archive for `publish-image`. Read-only token: `npm ci` runs inside
  # this build.
  #
  # After `build`, for the bare version its label carries, and so a tag that
  # fails the CHANGELOG or version check never gets as far as a build.
  #
  # The updater's image is built and checked here too, per platform, after the
  # app's: one runner per architecture builds both images of the release.
  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The image is built without .git (.dockerignore); see app/build.py.
      - name: stamp the commit
        run: python3 -m scripts.build_stamp
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # One build, two exporters: into the daemon for the smoke test, and as
      # an OCI archive of the very same image for the push. `provenance` is
      # off because buildx's own attestation would wrap the archive in an
      # index of its own, and the real provenance is attested on the published
      # index by `publish-image`.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: spend-tracker:release
          outputs: |
            type=docker
            type=oci,dest=image-${{ matrix.arch }}.tar
          # `source` is what links the ghcr.io package to this repository.
          # `version` is the bare number, the one `/api/health` reports.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: it starts against a fresh volume, answers, and is not root
        run: |
          set -eu
          docker volume create st-release > /dev/null
          docker run -d --name st-release -e SPENDTRACKER_AUTO_MIGRATE=1 \
            -v st-release:/var/lib/spend-tracker -p 18848:8848 spend-tracker:release
          for _ in $(seq 1 60); do
            sleep 2
            if curl -fsS http://127.0.0.1:18848/api/health > health.json 2>/dev/null; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' st-release)" != "true" ]; then
              echo "the container exited:"; docker logs st-release; exit 1
            fi
          done
          cat health.json
          python3 -c "
          import json
          body = json.load(open('health.json'))
          assert body['status'] == 'ok', body
          assert body['commit'], 'the image does not know its commit: ' + str(body)
          print('version', body['version'], '- commit', body['commit'])
          "
          docker exec st-release python -c "
          import pathlib, sys
          found = sorted(p.name for p in pathlib.Path('/var/lib/spend-tracker').iterdir())
          missing = [n for n in ('spendtracker.sqlite3', 'secret.key') if n not in found]
          sys.exit(f'the volume is missing {missing}' if missing else 0)
          "
          uid=$(docker exec st-release python -c "import os; print(os.getuid())")
          echo "running as uid $uid"
          test "$uid" = "65532"
      - name: logs
        if: always()
        run: docker logs st-release || true

      # The archive is one plain image manifest of this architecture -- not an
      # index, not something else's -- and carries the labels the daemon's
      # copy does. The updater reads `version` off whichever platform image
      # the engine pulls, so `labels` compares the two archives' sets.
      - name: the archive is this platform's image, labelled
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xOf "image-${ARCH}.tar" --wildcards '*index.json' | jq -e '
            (.manifests | length) == 1
            and .manifests[0].mediaType == "application/vnd.oci.image.manifest.v1+json"' > /dev/null \
            || { echo "image-${ARCH}.tar is not a single image manifest:"; tar -xOf "image-${ARCH}.tar" --wildcards '*index.json'; exit 1; }
          skopeo inspect "oci-archive:image-${ARCH}.tar" > inspect.json
          test "$(jq -r .Architecture inspect.json)" = "$ARCH" \
            || { echo "the archive says $(jq -r .Architecture inspect.json), not $ARCH"; exit 1; }
          jq -S .Labels inspect.json > "labels-${ARCH}.json"
          docker inspect -f '{{json .Config.Labels}}' spend-tracker:release | jq -S . > daemon-labels.json
          diff daemon-labels.json "labels-${ARCH}.json"
          test "$(jq -r '."org.opencontainers.image.version"' "labels-${ARCH}.json")" = "$VERSION" \
            || { echo "the version label is not ${VERSION}:"; cat "labels-${ARCH}.json"; exit 1; }
          cat "labels-${ARCH}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
      # The labels on their own, so `labels` need not download two images to
      # compare two small files.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: labels-${{ matrix.arch }}
          path: labels-${{ matrix.arch }}.json
          if-no-files-found: error

      # The self-updater: the `updater` target of the same Dockerfile, on the
      # same digests, with the same OCI labels the app gets here. Its own
      # `updater-protocols` label is in the Dockerfile. No `npm ci` runs in
      # this target, but it shares the job, so the token stays read-only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: updater
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: spend-tracker-updater:release
          outputs: |
            type=docker
            type=oci,dest=updater-${{ matrix.arch }}.tar
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Run as compose runs it -- read-only, no capabilities, the runner's
      # engine socket, a fresh `update` volume -- until it has written its
      # first heartbeat. Then, from inside it: uid 65532 with group 65532,
      # the fresh volume initialised 65532:65532 at 2770 (C11), nothing
      # listening on any port or socket in its namespace (E10), and no shell,
      # package manager or engine CLI on its PATH.
      - name: the updater runs, listens on nothing, and is not root
        run: |
          set -eu
          docker volume create st-update > /dev/null
          docker run -d --name st-updater --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --security-opt label=disable \
            --group-add "$(stat -c %g /var/run/docker.sock)" --group-add 65532 \
            -v st-update:/update -v /var/run/docker.sock:/run/engine.sock \
            spend-tracker-updater:release
          for _ in $(seq 1 30); do
            sleep 2
            if docker exec st-updater python -c "import json, sys; sys.exit(json.load(open('/update/updater.json'))['socket'] != 'ok')" 2>/dev/null; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' st-updater)" != "true" ]; then
              echo "the updater exited:"; docker logs st-updater; exit 1
            fi
          done
          docker exec st-updater python -c "print(open('/update/updater.json').read())"
          docker exec -i -e SHELL_FREE=1 st-updater python - < tests/self_update/updater_smoke.py

      - name: updater logs
        if: always()
        run: docker logs st-updater || true

      - name: the updater archive is this platform's image, labelled
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xOf "updater-${ARCH}.tar" --wildcards '*index.json' | jq -e '
            (.manifests | length) == 1
            and .manifests[0].mediaType == "application/vnd.oci.image.manifest.v1+json"' > /dev/null \
            || { echo "updater-${ARCH}.tar is not a single image manifest"; exit 1; }
          skopeo inspect "oci-archive:updater-${ARCH}.tar" > inspect.json
          test "$(jq -r .Architecture inspect.json)" = "$ARCH" \
            || { echo "the updater archive says $(jq -r .Architecture inspect.json), not $ARCH"; exit 1; }
          jq -S .Labels inspect.json > "updater-labels-${ARCH}.json"
          docker inspect -f '{{json .Config.Labels}}' spend-tracker-updater:release | jq -S . > daemon-labels.json
          diff daemon-labels.json "updater-labels-${ARCH}.json"
          test "$(jq -r '."org.opencontainers.image.version"' "updater-labels-${ARCH}.json")" = "$VERSION" \
            || { echo "the updater's version label is not ${VERSION}"; exit 1; }
          cat "updater-labels-${ARCH}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: updater-image-${{ matrix.arch }}
          path: updater-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: updater-labels-${{ matrix.arch }}
          path: updater-labels-${{ matrix.arch }}.json
          if-no-files-found: error

  # Both platform images carry the same labels, byte for byte. The updater
  # cannot choose which of the two the engine pulls, so a label that differed
  # between them would be a version that depends on the machine reading it.
  # Runs on a dry run too; it needs no token.
  labels:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*labels-*'
          merge-multiple: true
      - name: both platform images carry the same labels
        run: |
          set -eu
          cat labels-amd64.json
          diff labels-amd64.json labels-arm64.json \
            || { echo "the amd64 and arm64 images disagree on their labels"; exit 1; }
          cat updater-labels-amd64.json
          diff updater-labels-amd64.json updater-labels-arm64.json \
            || { echo "the amd64 and arm64 updater images disagree on their labels"; exit 1; }
          for file in labels-amd64.json updater-labels-amd64.json; do
            for key in source revision version licenses; do
              jq -e --arg key "org.opencontainers.image.$key" '.[$key] | length > 0' "$file" > /dev/null \
                || { echo "org.opencontainers.image.$key is missing from $file"; exit 1; }
            done
          done
          # The protocol labels (C4): the one the app writes, the window the
          # updater accepts. The updater reads both off the pulled image, and
          # an app image without one is read as protocol 1 only by default.
          jq -e '."com.github.mariolonghi-com.spend-tracker.updater-protocol" | test("^[0-9]+$")' labels-amd64.json > /dev/null \
            || { echo "the app image has no updater-protocol label"; exit 1; }
          jq -e '."com.github.mariolonghi-com.spend-tracker.updater-protocols" | test("^[0-9]+-[0-9]+$")' updater-labels-amd64.json > /dev/null \
            || { echo "the updater image has no updater-protocols window"; exit 1; }

  # The release, as a draft: the tarball attested and attached, the body
  # written, nothing public yet. A draft is not offered by the releases page,
  # `releases/latest` or the API's `latest`, so a run that fails after this
  # point leaves nothing a user or the updater can act on.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    # The `release` environment (#96): with a required reviewer set on it in
    # the repository's settings, a pushed `v*` tag builds and then waits for a
    # click before anything is published. The reviewer is a repository
    # setting, not a line here -- and an environment this names that does not
    # exist yet is created on the first run *with no protection*, so this line
    # alone guards nothing until the reviewer is added.
    #
    # One gate, here, and only here: `publish-image` needs this job and
    # `publish-release` needs `publish-image`, so nothing reaches Releases or
    # ghcr.io without this one approval, and a release is one click rather
    # than three. `tests/test_release_workflow.py` fails if either of them
    # stops depending on this job. Keeping the environment off
    # `publish-image` also keeps its attestation's certificate exactly as the
    # updater's verifier was tested against.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that can write to the repository, and it checks out nothing
    # and installs nothing: it takes the tarball `build` made, attests it and
    # attaches it to a release.
    permissions:
      contents: write
      id-token: write       # the Sigstore certificate behind the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tarball
          path: dist

      # Checked again here, against the digests written beside them in
      # `build`: what is published is exactly what was built, byte for byte.
      - name: the tarballs match their checksums
        run: cd dist && sha256sum -c ./*.tar.gz.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The CHANGELOG section first, then how to get it. GitHub's generated
      # notes -- the pull-request list -- are appended after this by the
      # release action.
      - name: the release body
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          test -s dist/release-notes.md || { echo "build left no release-notes.md"; exit 1; }
          {
            cat dist/release-notes.md
            cat <<EOF

          ---

          Needs Python 3.12+ and nothing else — the client is prebuilt inside.

              tar xzf household-spend-tracker.tar.gz && cd household-spend-tracker-*
              make install-prod && make migrate && make serve

          Or the container, for linux/amd64 and linux/arm64: \`docker pull ${IMAGE}:${VERSION}\`,
          with its self-updater, \`${UPDATER_IMAGE}:${VERSION}\`, which compose.yaml runs beside it.

          Check where either came from with
          \`gh attestation verify <file or oci://image> --repo ${GITHUB_REPOSITORY}\`.

          **Upgrading an instance that already has a ledger: read
          \`deploy/UPGRADING.md\` first, and run \`make upgrade-check\`.** It
          names every migration between your database and this release and
          says which of them cannot be undone.
          EOF
          } > body.md
          cat body.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.cdx.json
          body_path: body.md
          generate_release_notes: true

  # The two platform images `image` built and started, pushed by digest and
  # joined into one index under the version tag -- for the app and for the
  # updater alike. Each index digest is what its provenance names and what the
  # updater verifies and pulls; the floating tags wait for `publish-release`.
  # After `publish`, so there is a draft to go public behind this; before it
  # goes public, so a push that fails leaves the draft a draft.
  publish-image:
    needs: [build, image, labels, publish]
    if: github.ref_type == 'tag'
    # Gated through `publish` (it needs it); see the comment there.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.app }}
      updater-digest: ${{ steps.index.outputs.updater }}
    steps:
      # image-<arch> and updater-image-<arch>: the four archives.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*image-*'
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # By digest and untagged: the archive's manifest, pushed as it is
      # (`--preserve-digests` refuses to convert it), to the reference its own
      # digest names, so the registry holds exactly what was smoke-tested.
      # skopeo rather than `docker push` because the daemon cannot push an
      # image that has no tag, and a per-platform tag would be one more thing
      # the registry page lists and nobody should pull.
      - name: push each platform image by digest
        id: push
        run: |
          set -eu
          for kind in app updater; do
            if [ "$kind" = app ]; then repo="$IMAGE"; archive=image; else repo="$UPDATER_IMAGE"; archive=updater; fi
            for arch in amd64 arm64; do
              digest="$(skopeo inspect "oci-archive:${archive}-${arch}.tar" | jq -r .Digest)"
              case "$digest" in sha256:*) ;; *) echo "no digest for $kind $arch: $digest"; exit 1 ;; esac
              skopeo copy --preserve-digests "oci-archive:${archive}-${arch}.tar" "docker://${repo}@${digest}"
              echo "${kind}-${arch}=${digest}" >> "$GITHUB_OUTPUT"
              echo "pushed ${repo} linux/${arch} as ${digest}"
            done
          done

      # One index over the two, per image, tagged with the version alone. Its
      # digest is that image's identity from here on: the attestation's
      # subject, what the updater pins, what the floating tags are pointed at
      # last.
      - name: the indexes
        id: index
        env:
          VERSION: ${{ needs.build.outputs.version }}
          APP_AMD64: ${{ steps.push.outputs.app-amd64 }}
          APP_ARM64: ${{ steps.push.outputs.app-arm64 }}
          UPDATER_AMD64: ${{ steps.push.outputs.updater-amd64 }}
          UPDATER_ARM64: ${{ steps.push.outputs.updater-arm64 }}
        run: |
          set -eu
          index() {  # kind repo amd64 arm64
            docker buildx imagetools create -t "$2:${VERSION}" "$2@$3" "$2@$4"
            digest="$(docker buildx imagetools inspect "$2:${VERSION}" --format '{{.Manifest.Digest}}')"
            case "$digest" in sha256:*) ;; *) echo "no index digest for $2: $digest"; exit 1 ;; esac
            docker buildx imagetools inspect --raw "$2@${digest}" \
              | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort > platforms.txt
            printf 'linux/amd64\nlinux/arm64\n' | diff - platforms.txt \
              || { echo "the $2 index does not hold exactly linux/amd64 and linux/arm64"; exit 1; }
            echo "$1=$digest" >> "$GITHUB_OUTPUT"
            echo "$2:${VERSION} is ${digest}"
          }
          index app "$IMAGE" "$APP_AMD64" "$APP_ARM64"
          index updater "$UPDATER_IMAGE" "$UPDATER_AMD64" "$UPDATER_ARM64"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.app }}
          push-to-registry: true
          # A storage record also wants `artifact-metadata: write`; the
          # attestation is what verification reads, and this keeps the grant
          # to what is used.
          create-storage-record: false
      # Its own subject name, which is the updater's own repository: the
      # verifier requires the name to match, so neither attestation can stand
      # in for the other (R19).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ steps.index.outputs.updater }}
          push-to-registry: true
          create-storage-record: false

      # What the updater will run, run here first: each attestation names its
      # index, and this repository's workflow signed it.
      - name: the attestations verify
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.index.outputs.app }}
          UPDATER: ${{ steps.index.outputs.updater }}
        run: |
          set -eu
          gh attestation verify "oci://${IMAGE}@${APP}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${UPDATER_IMAGE}@${UPDATER}" --repo "${GITHUB_REPOSITORY}"

      # With no credentials at all. A ghcr.io package can be private, and a
      # new one -- the updater's, on its first release -- may start that way: a private
      # package pulls fine from a job holding a token and fails for everyone
      # else, including every updater asked to install this release. Found out
      # here, while the release is still a draft, not by the first user.
      - name: both packages are public
        env:
          VERSION: ${{ needs.build.outputs.version }}
          APP: ${{ steps.index.outputs.app }}
          UPDATER: ${{ steps.index.outputs.updater }}
        run: |
          set -eu
          docker logout ghcr.io
          public() {  # repo digest
            if ! docker pull "$1:${VERSION}"; then
              echo "::error::$1 cannot be pulled without credentials. A new ghcr.io package starts private: make it public at https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${1##*/}/settings (Danger Zone, Change visibility, Public), then re-run the failed jobs of this run. The release is still a draft."
              exit 1
            fi
            pulled="$(docker buildx imagetools inspect "$1:${VERSION}" --format '{{.Manifest.Digest}}')"
            test "$pulled" = "$2" \
              || { echo "anonymous $1:${VERSION} is ${pulled}, not $2"; exit 1; }
            test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$1:${VERSION}")" = "$VERSION"
            echo "$1:${VERSION} pulls anonymously as $2"
          }
          public "$IMAGE" "$APP"
          public "$UPDATER_IMAGE" "$UPDATER"

  # Last: the draft goes public, and only then do `X.Y` and `latest` move.
  # Anything that reads the releases page, `releases/latest` or the floating
  # tags finds the image already there, attested and pullable. The order
  # inside the job is the order of the promises: a release that exists
  # without `latest` pointing at it is a release; `latest` pointing at an
  # image with no release is a surprise.
  publish-release:
    needs: [build, publish-image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # the draft flag
      packages: write     # the floating tags
    steps:
      - name: the release goes public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
          echo "${GITHUB_REF_NAME} is published"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # `1.2` and `latest` from `1.2.3`: the same index, re-tagged, so the
      # digest a user resolves through either is the attested one. The
      # updater's move with the app's, so `latest` of each is one release.
      - name: the floating tags move
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          UPDATER_DIGEST: ${{ needs.publish-image.outputs.updater-digest }}
        run: |
          set -eu
          minor="${VERSION%.*}"
          docker buildx imagetools create -t "${IMAGE}:${minor}" -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          echo "${IMAGE}:${minor} and ${IMAGE}:latest -> ${DIGEST}"
          docker buildx imagetools create -t "${UPDATER_IMAGE}:${minor}" -t "${UPDATER_IMAGE}:latest" "${UPDATER_IMAGE}@${UPDATER_DIGEST}"
          echo "${UPDATER_IMAGE}:${minor} and ${UPDATER_IMAGE}:latest -> ${UPDATER_DIGEST}"

      # And, once more with no credentials, each tag a user or compose.yaml's
      # default would pull resolves to the attested index, for both images.
      - name: every tag resolves anonymously to the attested index
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          UPDATER_DIGEST: ${{ needs.publish-image.outputs.updater-digest }}
        run: |
          set -eu
          docker logout ghcr.io
          resolves() {  # repo digest
            for tag in "$VERSION" "${VERSION%.*}" latest; do
              found="$(docker buildx imagetools inspect "$1:${tag}" --format '{{.Manifest.Digest}}')"
              test "$found" = "$2" \
                || { echo "anonymous $1:${tag} is ${found}, not $2"; exit 1; }
              echo "$1:${tag} -> ${found}"
            done
          }
          resolves "$IMAGE" "$DIGEST"
          resolves "$UPDATER_IMAGE" "$UPDATER_DIGEST"
