name: codeql

# Static analysis of the Python backend and the TypeScript client. Free on a
# public repository; results land in the Security tab, not in the PR checks,
# unless a query hits at error severity.
#
# Runs on the release pull request, on `main` after it lands, weekly, and by
# hand -- not on every pull request into `dev`: two languages cost ~4-6
# minutes each, and a weekly sweep plus the release gate catches the same
# findings a week later at most, on a one-person project where nothing ships
# between releases.
#
# "Advanced setup" (this file) rather than the repository-settings "default
# setup" so the action is SHA-pinned like everything else and the languages
# and schedule are in git. Turning on default setup in settings would disable
# this file; pick one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # to upload the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the lower-precision queries; on a codebase
          # this size the extra noise is small and the extra reach is real.
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:${{ matrix.language }}
