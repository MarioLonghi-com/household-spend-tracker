# Nobody was watching the dependencies.
#
# The vite advisories in the 2026-09-19 review were found by running `npm audit`
# by hand; no automation would have said anything. Dependabot alerts also have
# to be switched on in the repository's own settings -- this file only says what
# to watch and how often, and is inert without that.
#
# **One pull request per ecosystem per week**, Monday morning, since #242.
# Eleven separate pull requests for one week's patch releases is how a bot gets
# muted, and a muted bot is worse than no bot.
#
# - **Python: minor and patch together, each major on its own.** The groups
#   once said `update-types: ["minor", "patch"]` while requirements.txt held
#   only `>=` floors, which Dependabot cannot classify -- so every pip bump fell
#   out of the group and opened on its own: eight separate pull requests on
#   2026-09-29 and five on 2026-09-30, each a full CI run. Since #46 the `.in`
#   files hold the floors and requirements*.txt are `uv pip compile` locks with
#   exact, hashed pins, which the `uv` ecosystem reads and re-locks; an exact
#   pin is a bump it can classify, so the split is back. A major still opens
#   alone, because it is the one worth reading.
# - **The other ecosystems: one group with no `update-types` filter**, which
#   puts everything in one pull request.
# - **`cooldown`.** A release that is seven days old has had a week for its own
#   regressions and any hijacked-package advisory to surface. The cheapest
#   supply-chain control there is. Security updates ignore it, and open on
#   their own regardless of the schedule.
# - **`open-pull-requests-limit`** of two, not five: with everything in one
#   group the weekly pull request is the only one expected, and the limit is a
#   ceiling on surprises. It counts version updates only; security updates
#   have a separate allowance and are never held back by it.
#
# Every update targets `dev`, not `main`. Work lands on `dev` and reaches `main`
# only through a release merge; a bump opened against `main` is written against
# code that is days behind and has to be redone by hand. Dependabot reads this
# file from the default branch, so a change here takes effect from the next
# `dev` -> `main` merge.
#
# **No automatic rebases.** Dependabot rebases every open pull request each
# time something lands on the target branch, and each rebase is a full CI run
# on a change nobody asked to re-test -- one merge into `dev` with five bumps
# open was five more runs. With it off, a bump goes stale against `dev` until
# somebody wants it: comment `@dependabot rebase` on it then, and it catches up
# and re-runs once. A conflicting one still says so on the pull request.
#
# tests.yml's path gate runs only the affected tier for each: a pip pull
# request runs lint, the suite, the rehearsal and the audit; an npm one the
# client, e2e and the audit; an actions one everything, since a workflow file
# changed.

version: 2
updates:
  # `uv`, not `pip`: requirements*.txt are written by `uv pip compile` from
  # the `.in` files (#46), and it is the `uv` ecosystem that understands that
  # pair -- it edits the `.in` floor where it has to and re-runs the compile, so
  # the hashes move with the version.
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      client:
        patterns: ["*"]

  # The workflows pin every action to a commit SHA, which is the point -- a tag
  # is mutable. Dependabot understands the `# vX.Y.Z` comment beside the pin
  # and moves both together, so pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's bases are pinned by digest -- Node and both Chainguard
  # Pythons -- which only stays a discipline rather than a fossil if something
  # moves them. This is what does. It watches literal `FROM` lines, which is
  # why the Chainguard bases are stages of their own rather than `ARG`
  # defaults (#95).
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
