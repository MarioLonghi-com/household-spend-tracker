# How the desktop app is packaged (#61). `npm run dist:mac`, `dist:mas` or
# `dist:win` after the backend is frozen into ../build/backend (see
# desktop/README.md); every artefact lands in desktop/dist.
#
# Store signing is #63's: these builds are unsigned (macOS) or signed with a
# test certificate afterwards (MSIX, scripts/sign-msix.ps1).
#
# Electron's fuses (#63) are flipped by `afterPack` when SPENDTRACKER_FUSES is
# `on`, which scripts/desktop_build.py sets for the store and Windows builds
# and leaves off for the build the smoke test drives. scripts/fuses.cjs says
# which fuses and why, and reads them back afterwards.

appId: app.spendtracker.spendtracker
# The name both stores list the app under (#346). The ledger's folder keeps
# its own name, `Spend Tracker` (src/places.ts).
productName: Household Spend Tracker
copyright: Spend Tracker contributors

directories:
  output: dist
  buildResources: build-resources

# The bundle is the whole shell (vite.config.ts): no node_modules ships.
files:
  - build/main.cjs
  - build/preload.cjs
  - package.json
asar: true
npmRebuild: false

afterPack: scripts/fuses.cjs

# The frozen backend, run from the install location, read-only; and the
# third-party notices the Licences window shows (#63), written by
# scripts/third_party_notices.py. Chromium's own, LICENSES.chromium.html,
# electron-builder keeps from the Electron download by itself.
extraResources:
  - from: ../build/backend/spend-tracker-backend
    to: backend
  - from: ../build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

mac:
  category: public.app-category.finance
  icon: build-resources/icon.icns
  minimumSystemVersion: "13.0"
  target:
    - target: dir
      arch: arm64
  hardenedRuntime: true
  entitlements: entitlements/mac.plist
  entitlementsInherit: entitlements/mac.inherit.plist
  # Export compliance, answered once here instead of in App Store Connect for
  # every build: the app uses only exempt encryption -- HTTPS, the OS's own,
  # and standard algorithms protecting the person's own data (decided
  # 2026-11-13). Without it a build waits in App Store Connect for the
  # question to be answered, and the release job's status wait with it.
  # The `mas` target inherits this; package-mas.sh refuses an app without it.
  extendInfo:
    ITSAppUsesNonExemptEncryption: false

# The Mac App Store build. electron-builder makes it unsigned; the sandbox
# entitlements, the provisioning profile and the inside-out signing are
# scripts/sign-mas.sh's, which is what made the spike pass (#59).
mas:
  hardenedRuntime: false
  entitlements: entitlements/mas.plist
  entitlementsInherit: entitlements/mas.inherit.plist
masDev:
  hardenedRuntime: false
  entitlements: entitlements/mas.plist
  entitlementsInherit: entitlements/mas.inherit.plist

win:
  icon: build-resources/icon.ico
  target:
    - target: appx
      arch: x64
    - target: dir
      arch: x64

# The identity here is a test one. The Store's comes from the name reserved in
# Partner Center (#63) and replaces it at build time, through the environment
# scripts/desktop_build.py reads (`SPENDTRACKER_APPX_*`), never by a commit.
appx:
  identityName: SpendTracker.Test
  publisher: CN=SpendTrackerTest
  publisherDisplayName: Spend Tracker (test)
  applicationId: SpendTracker
  # Must match the name reserved in Partner Center (#346).
  displayName: Household Spend Tracker
  backgroundColor: "#15705C"
  # The languages the app speaks (#58). Partner Center asks for a Store
  # listing in each language a package declares, which is what #63 wants.
  languages:
    - en-GB
    - pt-BR
    - es-ES
    - sv-SE
  customManifestPath: appxmanifest.xml
