[project]
name = "household-spend-tracker"
version = "0.9.3"
description = "Self-hosted multi-currency spend tracker for one household"
requires-python = ">=3.12"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=statements --cov=updater --cov-report=term-missing --cov-fail-under=85"
# `repo_wide` marks a test that reads files outside the backend -- every tracked
# file, the client's sources, the Dockerfile. CI runs those on every pull
# request (`-m repo_wide`), and the rest only when the backend changed. A test
# that starts reading such a file needs the mark, or a change to that file can
# skip it. See `.github/workflows/tests.yml`.
markers = [
    "repo_wide: reads files outside the backend; runs on every pull request",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    # Starlette's own warning class is a UserWarning, so the two above miss it.
    # It asks for `httpx2`, which the test client does not need yet (#110).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
